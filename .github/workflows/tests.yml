name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor (nltk and wn both require >=3.10) and matches the
        # development environment; 3.12 is the ceiling.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The `wn` package does not create its data directory, and opening its
      # SQLite database in a missing directory fails. Create both paths before
      # the cache step so a cache miss cannot leave them absent.
      - name: Prepare data directories
        run: mkdir -p ~/.wn_data ~/nltk_data

      - name: Cache wordnet and NLTK data
        uses: actions/cache@v4
        with:
          path: |
            ~/.wn_data
            ~/nltk_data
          key: wndata-${{ runner.os }}-ewn2020-hyde01-nltk3

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install spaCy English model
        run: python -m spacy download en_core_web_sm

      - name: Download wordnet data
        run: |
          python - <<'PY'
          import wn
          # English WordNet backs the English-language tests.
          if 'ewn' not in {lex.id for lex in wn.lexicons()}:
              wn.download('ewn:2020')
          PY

          # The hybrid lexicons back the multilingual tests. They are not on
          # the public `wn` project index, so fetch the WN-LMF resources
          # directly. Without them those tests skip (see tests/conftest.py),
          # so a failure here must not fail the job.
          python - <<'PY' || true
          import io, urllib.request, zipfile
          import wn

          BASE = ('https://github.com/pssvlng/open-european-wordnets-hybrid'
                  '/raw/main/{}_hybrid.zip')
          # The suite's fixtures span the six languages the library treats as
          # its default set; installing fewer leaves tests failing rather than
          # skipping, because `wn` raises for a language with no lexicon.
          wanted = {'de': 'hyde', 'fr': 'hyfr', 'it': 'hyit',
                    'es': 'hyes', 'nl': 'hynl', 'pt': 'hypt'}

          installed = {lex.id for lex in wn.lexicons()}
          for code, lexicon_id in wanted.items():
              if lexicon_id in installed:
                  continue
              print(f'downloading {code}_hybrid...', flush=True)
              with urllib.request.urlopen(BASE.format(code), timeout=600) as response:
                  archive = zipfile.ZipFile(io.BytesIO(response.read()))
              archive.extractall('/tmp/hybrid')
              wn.add(f'/tmp/hybrid/{code}_hybrid.xml', progress_handler=None)
          PY
          # NLTK renamed several resources across releases: punkt -> punkt_tab,
          # averaged_perceptron_tagger -> ..._eng, omw-1.4 -> omw-2.0. Request
          # both spellings of each; `|| true` because a name absent from the
          # installed NLTK version is expected, not an error.
          python -m nltk.downloader wordnet stopwords
          for resource in punkt punkt_tab \
                          averaged_perceptron_tagger averaged_perceptron_tagger_eng \
                          omw-1.4 omw-2.0; do
            python -m nltk.downloader "$resource" || true
          done

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run doctests
        run: |
          python -m doctest passivlingo_dictionary/core.py -v | tail -1
          python -m doctest passivlingo_dictionary/__init__.py -v | tail -1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        # -W turns warnings into errors, so a broken cross-reference or a
        # malformed directive fails the build rather than shipping silently.
        run: python -m sphinx -b html documentation documentation/_build/html -W
